[project]
name = "anima-digital-human"
version = "0.1.0"
description = "Real-time audio-driven neural digital human sidecar for Anima (Apple Silicon Metal/MPS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
